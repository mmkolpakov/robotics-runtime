---
name: release

on:
  push:
    tags: ["contracts-v*", "harness-v*"]
  workflow_dispatch:
    inputs:
      candidate:
        description: "Exact candidate tag matching this ref's package version; dry-run only"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.event_name }}-${{ inputs.candidate || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      package: ${{ steps.plan.outputs.package }}
      pypi_environment: ${{ steps.plan.outputs.pypi_environment }}
      candidate: ${{ steps.plan.outputs.candidate }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    env:
      CANDIDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch main for tag ancestry verification
        if: github.event_name == 'push'
        run: git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - name: Install release tools in a separate environment
        run: |
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/release-tools"
          printf 'UV_PROJECT_ENVIRONMENT=%s\n' "$UV_PROJECT_ENVIRONMENT" >> "$GITHUB_ENV"
          printf 'RELEASE_PYTHON=%s/bin/python\n' "$UV_PROJECT_ENVIRONMENT" >> "$GITHUB_ENV"
          uv sync --locked --only-group dev --no-install-workspace --python 3.12
      - name: Test release guards
        run: |
          "$RELEASE_PYTHON" -m ruff check scripts/release tests/release
          "$RELEASE_PYTHON" -m ruff format --check scripts/release tests/release
          "$RELEASE_PYTHON" -m mypy --explicit-package-bases scripts/release tests/release
          "$RELEASE_PYTHON" -m pytest tests/release --junitxml=artifacts/release/tests.xml
      - name: Require published schema and semantic compatibility
        run: '"$RELEASE_PYTHON" -m scripts.check_schema_compatibility'
      - name: Validate exact candidate and released contracts source
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RELEASE_PYTHON" -m scripts.release.plan \
            --candidate "$CANDIDATE" --event "$GITHUB_EVENT_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --output artifacts/release/plan.json --github-output "$GITHUB_OUTPUT"
      - name: Build the selected package without workspace sources
        env:
          PACKAGE: ${{ steps.plan.outputs.package }}
          SOURCE_DATE_EPOCH: ${{ steps.plan.outputs.source_date_epoch }}
        run: uv build --package "$PACKAGE" --no-sources --out-dir artifacts/release/dist
      - name: Install wheel and sdist separately outside the workspace
        run: |
          "$RELEASE_PYTHON" -m scripts.release.verify_install \
            --plan artifacts/release/plan.json --dist artifacts/release/dist \
            --python 3.12 --report artifacts/release/clean-install.json
      - name: Capture the source-bound compatibility corpus outside distributions
        run: |
          "$RELEASE_PYTHON" -m scripts.schema_compatibility.snapshot \
            --plan artifacts/release/plan.json --output artifacts/release/corpus
      - name: Upload validated compatibility corpus
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: compatibility-corpus-${{ steps.plan.outputs.candidate }}
          path: artifacts/release/corpus/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-distributions-${{ steps.plan.outputs.candidate }}
          path: |
            artifacts/release/dist/*.whl
            artifacts/release/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Upload release verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release/*.json
            artifacts/release/*.xml
          if-no-files-found: warn
          retention-days: 7

  publish-pypi:
    if: github.event_name == 'push' && vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ needs.build.outputs.pypi_environment }}
      url: https://pypi.org/p/${{ needs.build.outputs.package }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-distributions-${{ needs.build.outputs.candidate }}
          path: dist/
      - name: Publish verified artifacts through Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

  github-release:
    if: github.event_name == 'push' && needs.publish-pypi.result == 'success'
    needs: [build, publish-pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      CANDIDATE: ${{ needs.build.outputs.candidate }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-distributions-${{ needs.build.outputs.candidate }}
          path: dist/
      - name: Download validated compatibility corpus
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: compatibility-corpus-${{ needs.build.outputs.candidate }}
          path: corpus/
      - name: Attest verified distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: |
            dist/*
            corpus/*.json
          create-storage-record: false
      - name: Create the release without overwriting existing assets
        run: |
          set -euo pipefail
          if ! gh release view "$CANDIDATE" --json tagName >/dev/null 2>&1; then
            flags=()
            if [[ "$PRERELEASE" == true ]]; then
              flags+=(--prerelease --latest=false)
            fi
            gh release create "$CANDIDATE" dist/* corpus/*.json --verify-tag --generate-notes "${flags[@]}"
          fi
      - name: Verify immutable release assets
        run: |
          set -euo pipefail
          verified=0
          for attempt in 1 2 3 4 5 6; do
            if gh release verify "$CANDIDATE"; then
              verified=1
              break
            fi
            if [[ "$attempt" -lt 6 ]]; then sleep 5; fi
          done
          [[ "$verified" == 1 ]]
          for artifact in dist/* corpus/*.json; do
            gh release verify-asset "$CANDIDATE" "$artifact"
          done
