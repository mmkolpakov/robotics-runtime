---
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: docs/reader/requirements.lock
      - name: Install the isolated hash-locked documentation toolchain
        run: |
          uv venv .docs-venv --python 3.12
          uv pip sync --python .docs-venv/bin/python --require-hashes docs/reader/requirements.lock
      - name: Audit the locked documentation dependencies
        run: |
          uv tool run --from pip-audit==2.9.0 pip-audit --strict --require-hashes \
            --no-deps --disable-pip --format json \
            --requirement docs/reader/requirements.lock
      - name: Build strict HTML, text and LLM documentation
        run: .docs-venv/bin/python docs/reader/build.py
      - name: Upload the preview and source exports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: documentation-${{ github.sha }}
          path: build/docs/html/
          if-no-files-found: error
          retention-days: 7
      - name: Configure GitHub Pages
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Upload the Pages artifact
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: build/docs/html/

  deploy:
    if: >-
      needs.build.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
