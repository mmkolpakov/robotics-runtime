---
name: host

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      options: --init
      image: node:24.21.0-trixie-slim@sha256:c83040f7e24bacea68e58a0b96a484ba430bf24abb2973eab7ba4701144b7b63
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: node --version && npm --version
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:boundary
      - run: npm audit --audit-level=high
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the existing Python workspace for worker integration
        working-directory: .
        run: uv sync --locked --all-packages
      - run: npm run test:workers
