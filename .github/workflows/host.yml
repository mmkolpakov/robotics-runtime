---
name: host

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      options: --init
      image: node:24.22.2-trixie-slim@sha256:e053394f15519046270b637f0655c284d2fc844e013451fcb36e02dcfba29280
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: node --version && npm --version
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:boundary
      - run: npm audit --audit-level=high
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the existing Python workspace for worker integration
        working-directory: .
        run: uv sync --locked --all-packages
      - run: npm run test:workers
