---
name: links

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: >-
      ${{ fromJSON('{"hosted":"ubuntu-24.04","home":["self-hosted","linux","x64","robotics-ci-home"]}')
          [vars.ROBOTICS_CI_EXECUTOR || 'hosted'] }}
    timeout-minutes: 10
    steps:
      - name: Check CI executor and source context
        id: ci-profile
        uses: mmkolpakov/robotics-runtime/.github/actions/ci-profile@ba72584a64837724b1a2df5279019cde15a80d5e
        with:
          executor: ${{ vars.ROBOTICS_CI_EXECUTOR || 'hosted' }}
          architecture: x64
          runner-environment: ${{ runner.environment }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: >-
            --no-progress
            --root-dir .
            --exclude '^https?://([a-z0-9-]+\.)?example\.(org|com|net)(/|$)'
            './**/*.md'
          fail: true
          failIfEmpty: true
