---
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.package }} (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [contracts, harness]
        python: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python }}
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - name: Synchronize the complete locked workspace
        run: |
          uv sync --locked --all-packages --all-groups
          uv pip check --python .venv/bin/python
      - name: Check source and test types
        run: uv run --no-sync --directory "packages/${PACKAGE}" mypy src tests
      - name: Run package tests with coverage
        run: |
          mkdir -p "artifacts/${PACKAGE}"
          cd "packages/${PACKAGE}"
          if [[ "$PACKAGE" == harness ]]; then
            uv run --no-sync coverage run --branch -m pytest \
              --junitxml=../../artifacts/harness/junit.xml
            uv run --no-sync coverage report --show-missing --fail-under=80
            uv run --no-sync coverage xml -o ../../artifacts/harness/coverage.xml
          else
            uv run --no-sync pytest --junitxml=../../artifacts/contracts/junit.xml
          fi
      - name: Upload package validation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.package }}-${{ matrix.python }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch the immutable pre-workspace contracts baseline
        run: >-
          git fetch --no-tags https://github.com/mmkolpakov/robotics-runtime-contracts.git
          refs/tags/v0.16.0:refs/tags/contracts-legacy/v0.16.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-packages --all-groups
      - name: Keep the compatibility checker within its complexity budget
        run: >-
          uv run --no-sync ruff check --extend-select C901,PLR0913
          scripts/check_schema_compatibility.py scripts/schema_compatibility
          tests/test_schema_compatibility.py
      - name: Require published schema and semantic compatibility
        run: uv run --no-sync python scripts/check_schema_compatibility.py
      - run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure
      - name: Require reproducible core schema bytes
        run: |
          uv run --no-sync python scripts/bundle_schemas.py --check
          git diff --exit-code -- packages/contracts/src/robotics_runtime_contracts/schemas
      - run: >-
          uv run --no-sync python -m pytest tests/ci tests/release tests/schema_bundler
          tests/test_schema_compatibility.py
      - run: >-
          uv run --no-sync mypy --explicit-package-bases
          scripts/release scripts/bundle_schemas.py tests/release tests/workspace tests/schema_bundler
          scripts/check_schema_compatibility.py scripts/schema_compatibility
          tests/test_schema_compatibility.py
        env:
          MYPYPATH: packages/contracts/src:packages/harness/src

  consumers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the qualified infra fixture producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mmkolpakov/robotics-runtime-infra
          ref: dfbf26e99d3d569f9d25bdc260510220d4dd2872
          path: .consumer-infra
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-packages --all-groups
      - name: Validate producer examples and consumer fixtures together
        run: uv run --no-sync python -m pytest tests/workspace
      - name: Verify candidate wheels outside the workspace
        run: >-
          uv run --no-sync python -m scripts.release.verify_consumers
          --mode candidate --infra .consumer-infra --python 3.12
          --report artifacts/consumers/candidate.json
      - name: Verify the exact published package pair outside the workspace
        run: >-
          uv run --no-sync python -m scripts.release.verify_consumers
          --mode published --infra .consumer-infra --python 3.12
          --report artifacts/consumers/published.json
      - name: Upload installed consumer verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: installed-consumers-${{ github.sha }}
          path: artifacts/consumers/
          if-no-files-found: warn
          retention-days: 7

  evaluator-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-packages --all-groups
      - name: Build installed SDK and minimal author wheels
        run: |
          mkdir -p artifacts/evaluator-admission/wheels
          uv build --all-packages --no-sources --out-dir artifacts/evaluator-admission/wheels
          uv build --wheel packages/harness/consumer-examples/evidence-byte-check \
            --out-dir artifacts/evaluator-admission/wheels
          uv export --locked --package robotics-acceptance-harness --no-emit-workspace \
            --no-dev --format requirements-txt > artifacts/evaluator-admission/requirements.txt
      - name: Attest the CI author artifact
        id: author-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: artifacts/evaluator-admission/wheels/example_evidence_byte_check-0.1.0-py3-none-any.whl
          create-storage-record: false
      - name: Prepare exact verifier and external expectations
        env:
          ATTESTATION_BUNDLE: ${{ steps.author-attestation.outputs.bundle-path }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_SOURCE_REF: ${{ github.ref }}
          EXPECTED_SOURCE_DIGEST: ${{ github.sha }}
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/gh.tar.gz"
          echo "bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386  $RUNNER_TEMP/gh.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" --directory "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/gh_2.102.0_linux_amd64/bin/gh" artifacts/evaluator-admission/gh
          echo '7469124f706944133d6a169691dd1c6c3511b12e85878d255e044e2948df4c9b  artifacts/evaluator-admission/gh' | sha256sum --check
          cp packages/harness/tests/admission/trusted-root.jsonl artifacts/evaluator-admission/trusted-root.jsonl
          cp "$ATTESTATION_BUNDLE" artifacts/evaluator-admission/bundle.json
          uv run --no-sync python packages/harness/tests/admission/prepare.py \
            --wheel artifacts/evaluator-admission/wheels/example_evidence_byte_check-0.1.0-py3-none-any.whl \
            --bundle artifacts/evaluator-admission/bundle.json \
            --gh artifacts/evaluator-admission/gh \
            --root artifacts/evaluator-admission/trusted-root.jsonl \
            --repository "$EXPECTED_REPOSITORY" \
            --identity "https://github.com/$EXPECTED_WORKFLOW_REF" \
            --ref "$EXPECTED_SOURCE_REF" --commit "$EXPECTED_SOURCE_DIGEST" \
            --destination artifacts/evaluator-admission
      - name: Build the installed pure-Python evaluator fixture
        run: >-
          docker build --file packages/harness/tests/admission/Dockerfile
          --tag evaluator-admission:ci .
      - name: Execute authenticated author through read-only limited worker
        run: bash packages/harness/tests/admission/run.sh artifacts/evaluator-admission
      - name: Retain source, publisher and immutable-input witness
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: evaluator-admission-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/evaluator-admission/assessment/
            artifacts/evaluator-admission/expectations.json
            artifacts/evaluator-admission/receipts/
            artifacts/evaluator-admission/bundle.json
          if-no-files-found: warn
          retention-days: 7

  live-ros:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build ROS 2 Jazzy integration environment
        run: >-
          docker build --file packages/harness/tests/live/Dockerfile
          --tag harness-live:ci .
      - name: Exercise real ROS observer and installed CLI
        run: |
          mkdir -p artifacts/live
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --mount "type=bind,source=${PWD}/artifacts/live,target=/workspace/artifacts/live" \
            harness-live:ci
      - name: Upload ROS and Collector evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: live-ros-jazzy-${{ github.sha }}
          path: artifacts/live/
          if-no-files-found: warn
          retention-days: 7

  mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      options: --init
      image: node:24.21.0-trixie-slim@sha256:b64fccfbcd1ae10d11b969a868b50e1c2530a7054813d5cdea04ac3bce551697
    defaults:
      run:
        shell: sh
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: node --version && npm --version
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: mcp/public-cli.lock
      - name: Install the pinned public worker interfaces
        run: |
          uv venv --python 3.12 .public-workers
          uv pip install --python .public-workers/bin/python --require-hashes --no-deps \
            --only-binary :all: --requirement public-cli.lock
      - name: Exercise the real MCP client and public CLI workers
        run: |
          mkdir -p ../artifacts/mcp-cli-integration
          MCP_TEST_CONTRACTS_CLI="$PWD/.public-workers/bin/robotics-contracts" \
          MCP_TEST_HARNESS_CLI="$PWD/.public-workers/bin/robotics-acceptance" \
          MCP_TEST_REPORT_DIR="$PWD/../artifacts/mcp-cli-integration" \
            npm test > ../artifacts/mcp-cli-integration-test.log 2>&1
          cat ../artifacts/mcp-cli-integration-test.log
      - name: Build and install the current candidate workers independently
        working-directory: .
        run: |
          mkdir -p artifacts/mcp-candidate-wheels
          uv export --locked --all-packages --no-dev --no-emit-workspace --no-annotate \
            --format requirements-txt --output-file artifacts/mcp-candidate-runtime.lock
          uv build --package robotics-runtime-contracts --wheel \
            --out-dir artifacts/mcp-candidate-wheels
          uv build --package robotics-acceptance-harness --wheel \
            --out-dir artifacts/mcp-candidate-wheels
          uv venv --python 3.12 mcp/.candidate-workers
          uv pip install --python mcp/.candidate-workers/bin/python --require-hashes --no-deps \
            --only-binary :all: --requirement artifacts/mcp-candidate-runtime.lock
          uv pip install --python mcp/.candidate-workers/bin/python --no-deps \
            artifacts/mcp-candidate-wheels/*.whl
          uv pip check --python mcp/.candidate-workers/bin/python
      - name: Exercise native documents through the same read-only MCP interface
        run: |
          MCP_TEST_CONTRACTS_CLI="$PWD/.candidate-workers/bin/robotics-contracts" \
          MCP_TEST_HARNESS_CLI="$PWD/.candidate-workers/bin/robotics-acceptance" \
          MCP_TEST_REPORT_DIR="$PWD/../artifacts/mcp-cli-integration" \
            npm run test:native > ../artifacts/mcp-native-integration-test.log 2>&1
          cat ../artifacts/mcp-native-integration-test.log
      - name: Retain MCP integration outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mcp-cli-integration-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/mcp-cli-integration/
            artifacts/mcp-cli-integration-test.log
            artifacts/mcp-native-integration-test.log
          if-no-files-found: error
          retention-days: 7

  required-validation:
    name: ci
    needs: [package, quality, consumers, live-ros, mcp, evaluator-admission]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every validation job to pass
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          CONSUMERS_RESULT: ${{ needs.consumers.result }}
          ROS_RESULT: ${{ needs.live-ros.result }}
          MCP_RESULT: ${{ needs.mcp.result }}
          ADMISSION_RESULT: ${{ needs.evaluator-admission.result }}
        run: |
          test "$PACKAGE_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$CONSUMERS_RESULT" = success
          test "$ROS_RESULT" = success
          test "$MCP_RESULT" = success
          test "$ADMISSION_RESULT" = success
