[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "robotics-acceptance-harness"
version = "0.19.0"
description = "Attach-only acceptance observer for validated robotics executions."
requires-python = ">=3.12,<3.15"
readme = "README.md"
license = "MIT"
authors = [{ name = "mmkolpakov" }]
keywords = ["robotics", "ros2", "testing", "simulation", "acceptance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "junitparser>=5.0.1,<6",
  "opentelemetry-proto>=1.43,<2",
  "packaging>=24",
  "robotics-runtime-contracts>=0.17,<0.18",
]

[tool.uv.sources]
robotics-runtime-contracts = { workspace = true }

[project.optional-dependencies]
pytest = ["pytest>=8,<10"]

[project.scripts]
robotics-acceptance = "robotics_acceptance_harness.cli:main"

[project.urls]
Homepage = "https://github.com/mmkolpakov/robotics-runtime/tree/main/packages/harness"
Repository = "https://github.com/mmkolpakov/robotics-runtime"
Issues = "https://github.com/mmkolpakov/robotics-runtime/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["robotics_acceptance_harness"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]
