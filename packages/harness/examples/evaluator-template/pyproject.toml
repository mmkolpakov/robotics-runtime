[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "example-recording-evaluator"
version = "0.1.0"
description = "Example product evaluator for nonempty verified MCAP recordings."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "robotics-acceptance-harness>=0.20.0,<0.21",
  "mcap>=1.4,<2",
  "zstandard>=0.25.0,<1",
]

[project.entry-points."robotics_acceptance.evaluators"]
"org.example.recording" = "recording_evaluator:evaluate"

[tool.hatch.build.targets.wheel]
packages = ["src/recording_evaluator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
