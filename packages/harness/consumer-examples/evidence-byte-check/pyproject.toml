[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "example-evidence-byte-check"
version = "0.1.0"
description = "Minimal example evaluator using captured verified evidence bytes."
requires-python = ">=3.12,<3.15"
license = "MIT"

[project.entry-points."robotics_acceptance.evaluators"]
"org.example.evidence-bytes" = "evidence_byte_check:evaluate"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_byte_check"]
