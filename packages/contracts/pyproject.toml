[project]
name = "robotics-runtime-contracts"
version = "0.16.0"
description = "Canonical acceptance and evidence contracts for robotics runtimes."
requires-python = ">=3.12,<3.15"
readme = "README.md"
license = "MIT"
keywords = ["robotics", "ros2", "json-schema", "simulation", "acceptance-testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "jsonschema[format-nongpl]>=4.26,<5",
  "PyYAML>=6.0.3,<7",
  "referencing>=0.37,<1",
]

[project.scripts]
robotics-contracts = "robotics_runtime_contracts.cli:main"

[project.urls]
Homepage = "https://github.com/mmkolpakov/robotics-runtime-contracts"
Repository = "https://github.com/mmkolpakov/robotics-runtime-contracts"
Issues = "https://github.com/mmkolpakov/robotics-runtime-contracts/issues"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robotics_runtime_contracts"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/README.md", "/pyproject.toml", "/src", "/tests", "/docs/schema-digests.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]
